[package]
name = "portvakt"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["ws", "macros"] }
axum-server = { version = "0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }
base32 = "0.5"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
glob = "0.3.4"
hex = "0.4.3"
hmac = "0.13"
libc = "0.2.191"
mime_guess = "2.0.5"
portable-pty = "0.9.0"
rand = "0.10.3"
rcgen = "0.14.10"
regex = "1.13.1"
rpassword = "7.5.4"
rust-embed = { version = "8.13.0", features = ["include-exclude"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11"
sha2 = "0.11.1"
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
tempfile = "3.27.0"
