name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools

      - name: Test
        run: cargo test --locked

      - name: Build static binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          set -eu
          out=portvakt-${{ matrix.arch }}-linux.tar.gz
          cp target/${{ matrix.target }}/release/portvakt portvakt
          ./portvakt --version
          tar -czf "$out" portvakt LICENSE README.md
          sha256sum "$out" > "$out.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: portvakt-${{ matrix.arch }}
          path: portvakt-${{ matrix.arch }}-linux.tar.gz*

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          ls -la dist
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
          fi
